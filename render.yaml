# One-click deploy on Render's free tier.
# Set the three env vars marked sync:false in the dashboard - never in this file.
services:
  - type: web
    name: minitai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY      # your Groq key - paste in the dashboard
        sync: false
      - key: INVITE_CODES      # comma separated, one per person
        sync: false
      - key: MINITAI_SECRET    # long random string; keeps logins alive
        sync: false
      - key: MINITAI_RETENTION_HOURS
        value: "24"
      # Per person per day. Twenty friends x 240 would drain the shared free
      # Groq account before lunch; 60 minutes each is a real meeting a day.
      - key: MINITAI_DAILY_MINUTES
        value: "60"
      # The whole server's daily audio budget, kept under the free tier so the
      # account is never exhausted mid-meeting.
      - key: MINITAI_SERVICE_DAILY_MINUTES
        value: "400"
